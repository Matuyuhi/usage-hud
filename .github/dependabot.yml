# Action は SHA ピン留め運用なので、更新は Dependabot に拾わせる。
# 依存は GitHub Actions だけ（Swift 側に外部パッケージは無い）。
version: 2
updates:
  - package-ecosystem: github-actions
    # 既定の / は workflows しか見ないので、composite action の中の uses も拾わせる
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: monthly
      # 毎月 1 日の朝（JST）に出す。既定の UTC だと夜中に PR が立つ
      time: "09:00"
      timezone: Asia/Tokyo
    # 出たばかりの版は取らない。乗っ取られた Action のタグが差し替えられても、
    # 数日のうちに見つかって取り下げられることが多いので、その間は待つ（供給網対策）
    cooldown:
      default-days: 7
    groups:
      # minor / patch はまとめて 1 PR。major は破壊的変更があり得るので個別に出して中身を見る
      actions:
        update-types: [minor, patch]
        patterns: ["*"]
    commit-message:
      prefix: "ci"
