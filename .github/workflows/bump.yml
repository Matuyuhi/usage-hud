name: Bump version

# 手動起動専用。patch / minor / major を選ぶと、VERSION を上げる PR を自動で開く。
# その PR をマージすると release.yml が走り、新バージョンがリリースされる
# （マージが「公開してよいか」の確認ゲートになる）。
#
# サードパーティ Action は供給網最小化のため公式 actions/checkout のみ。残りは gh / sed。

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which semver part to bump"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute next version, bump, and open a PR
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
        run: |
          CUR="$(tr -d '[:space:]' < VERSION)"

          # VERSION と xcodeproj（MARKETING_VERSION / CURRENT_PROJECT_VERSION）を
          # まとめて上げる。ローカルからも同じ手順で上げられるよう、計算はスクリプト側に置く
          scripts/bump-version.sh "$BUMP"
          NEW="$(tr -d '[:space:]' < VERSION)"

          # 上げた結果が壊れていないこと（VERSION と pbxproj の一致など）を PR を開く前に確認する
          scripts/check-invariants.sh

          BR="bump/v${NEW}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BR"
          git add VERSION usage-hud.xcodeproj/project.pbxproj
          git commit -m "release: bump version to ${NEW} (${BUMP})"
          git push -u origin "$BR"

          gh pr create --base main --head "$BR" \
            --title "release: v${NEW}" \
            --body "Bump version \`${CUR}\` -> \`${NEW}\` (\`${BUMP}\`).

          Merging this triggers \`release.yml\` to build, publish v${NEW}, and update the Homebrew tap.

          (Opened automatically by the Bump version workflow.)"
