name: Bump version

# 手動起動専用。patch / minor / major を選ぶと、VERSION を上げる PR を自動で開く。
# その PR をマージすると release.yml が走り、新バージョンがリリースされる
# （マージが「公開してよいか」の確認ゲートになる）。
#
# サードパーティ Action は供給網最小化のため公式 actions/checkout のみ。残りは gh / sed。

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which semver part to bump"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute next version, bump, and open a PR
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
        run: |
          CUR="$(tr -d '[:space:]' < VERSION)"
          IFS='.' read -r MA MI PA <<< "$CUR"
          case "$BUMP" in
            major) MA=$((MA + 1)); MI=0; PA=0 ;;
            minor) MI=$((MI + 1)); PA=0 ;;
            patch) PA=$((PA + 1)) ;;
          esac
          NEW="${MA}.${MI}.${PA}"
          echo "bump ${BUMP}: ${CUR} -> ${NEW}"

          echo "$NEW" > VERSION

          BR="bump/v${NEW}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BR"
          git add VERSION
          git commit -m "release: bump version to ${NEW} (${BUMP})"
          git push -u origin "$BR"

          gh pr create --base main --head "$BR" \
            --title "release: v${NEW}" \
            --body "Bump version \`${CUR}\` -> \`${NEW}\` (\`${BUMP}\`).

          Merging this triggers \`release.yml\` to build, publish v${NEW}, and update the Homebrew tap.

          (Opened automatically by the Bump version workflow.)"
