name: CI

# PR と main への push で回す品質ゲート。
# 「リリースと同じビルドが通る」「壊すと厄介な設計判断が残っている」「見た目が変わっていない」を見る。
#
# サードパーティ Action は供給網最小化のため公式 actions/* のみ（bump/release と同じ方針）。

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同じ PR に push が続いたら古い実行は捨てる（main は履歴を残すのでキャンセルしない）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  invariants:
    name: Invariants
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the design invariants from CLAUDE.md
        run: scripts/check-invariants.sh

  build:
    name: Build (universal, Release)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show toolchain
        run: xcodebuild -version

      # release.yml と同じ条件で組む。ここが緑なら、そのままリリースできる
      - name: Build universal app
        run: |
          xcodebuild -project usage-hud.xcodeproj -scheme usage-hud \
            -configuration Release -derivedDataPath build \
            -destination 'generic/platform=macOS' \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$(tr -d '[:space:]' < VERSION)" \
            build

      # ウィジェットが同梱され、両方 ad-hoc 署名で、universal になっていること。
      # pluginkit への登録はインストールしないと確認できないので、ここでは同梱までを見る
      - name: Verify the built bundle
        run: |
          set -eu
          APP=build/Build/Products/Release/usage-hud.app
          APPEX="$APP/Contents/PlugIns/usage-hud-widgetExtension.appex"

          test -d "$APP"   || { echo "missing $APP"; exit 1; }
          test -d "$APPEX" || { echo "widget extension is not embedded in the app"; exit 1; }

          for binary in "$APP/Contents/MacOS/usage-hud" "$APPEX/Contents/MacOS/usage-hud-widgetExtension"; do
            lipo -archs "$binary"
            for arch in arm64 x86_64; do
              lipo -archs "$binary" | tr ' ' '\n' | grep -qx "$arch" ||
                { echo "$binary is missing the $arch slice"; exit 1; }
            done
          done

          for bundle in "$APP" "$APPEX"; do
            codesign -dv "$bundle" 2>&1 | tee /tmp/codesign.txt
            grep -q '^Signature=adhoc$' /tmp/codesign.txt ||
              { echo "$bundle is not ad-hoc signed"; exit 1; }
          done

          echo "app + widget: embedded, universal, ad-hoc signed"

  # パネル / ウィジェットのスナップショットテスト。参照画像は usage-hud-tests/__Snapshots__ にあり、
  # 見た目を意図して変えた PR では Record snapshots ワークフロー（snapshots.yml）で撮り直してコミットする。
  # 描画結果は毎回 artifact に上げるので、PR の見た目はそこで確認できる（不一致なら diff/ と expected/ も入る）
  snapshots:
    name: Snapshot tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show toolchain
        run: xcodebuild -version

      - name: Run snapshot tests (en_US / ja_JP)
        run: scripts/snapshot-test.sh

      - name: Upload rendered snapshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snapshots
          path: build-test/snapshots
          if-no-files-found: ignore
